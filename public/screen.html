<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大屏 · 沙漠掘金</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0906'/%3E%3Cpath d='M4 24h24' stroke='%23E7B15C' stroke-width='1.5'/%3E%3Cpath d='M7 24l6-13 4 8 3-4 5 9z' fill='none' stroke='%23E7B15C' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/theme.css?v=20261117c">
<style>
  .screen .shead .brand b { font-size: 20px; letter-spacing: .14em; }
  .legend { position: absolute; left: 22px; bottom: 18px; display: flex; gap: 18px; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .board-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .teamgrid { display: grid; gap: 8px; }
  .trow { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; font-size: 12px; }
  .trow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .st { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .trow.dead { opacity: .45; }
  .top3 { display: grid; gap: 8px; }
  .top3 .r { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .top3 .r:first-child { border-color: var(--line-strong); background: rgba(231,177,92,.07); }
  .top3 .rk { font-family: var(--font-mono); color: var(--sand); }
  .weathernow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .weathernow .w { padding: 8px; border: 1px solid var(--line); border-radius: 8px; text-align: center; }
  .weathernow .w .t { font-size: 9px; letter-spacing: .14em; color: var(--dim); }
  .weathernow .w .v { font-size: 12px; font-weight: 700; margin-top: 2px; }
</style>
</head>
<body>
<div class="screen">
  <div class="shead">
    <div class="brand">
      <div class="sigil"><svg viewBox="0 0 24 24" fill="none" stroke="#E7B15C" stroke-width="1.6"><path d="M3 19h18"/><path d="M6 19V12l6-5 6 5v7"/><path d="M10 19v-5h4v5"/></svg></div>
      <div><b id="scTitle">沙漠掘金</b><span id="scSub">DESERT GOLD · LIVE BOARD</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:26px">
      <div class="daymark"><div class="d num" id="scDay">0</div><div class="of">/ <span id="scTotal">25</span> DAY</div></div>
      <div style="text-align:right">
        <div class="cd-big" id="scClock">--:--</div>
        <div class="micro" id="scPhase">WAITING</div>
      </div>
    </div>
  </div>

  <div class="smap">
    <canvas id="screenCanvas"></canvas>
    <div class="legend">
      <span><i style="background:#e7b15c"></i>大本营 / 藏宝山</span>
      <span><i style="background:#f4a259"></i>村庄</span>
      <span><i style="background:#3fe0c8"></i>绿洲</span>
      <span><i style="background:#9a93a8"></i>古墓</span>
      <span><i style="background:#8a7657"></i>沙漠</span>
    </div>
  </div>

  <aside class="sboard">
    <div class="board-title"><span class="micro">已归营 · 金价榜</span><span class="chip" id="scReturned">0</span></div>
    <div class="top3" id="scTop"></div>
    <div class="hairline" style="margin:18px 0"></div>
    <div class="board-title"><span class="micro">今日 · 各格天候</span></div>
    <div class="weathernow" id="scWeather"></div>
    <div class="hairline" style="margin:18px 0"></div>
    <div class="board-title"><span class="micro">在场队伍</span><span class="chip dot" id="scAlive">0</span></div>
    <div class="teamgrid" id="scTeams"></div>
  </aside>

  <div class="sfoot">
    <div class="micro" style="white-space:nowrap;color:var(--sand)">播报</div>
    <div style="flex:1;overflow:hidden"><div class="move" id="scTicker" style="display:flex;gap:36px;white-space:nowrap;font-size:13px;color:var(--muted);animation:scroll 30s linear infinite"></div></div>
  </div>
</div>
<div class="toasts"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/api.js?v=20261117c"></script>
<script src="/js/map.js?v=20261117c"></script>
<script src="/js/screen.js?v=20261117c"></script>
</body>
</html>
