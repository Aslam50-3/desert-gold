services:
  desert-gold:
    build: .
    image: desert-gold:latest
    container_name: desert-gold
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      PORT: 3000
      TZ: Asia/Shanghai
      DATA_DIR: /data
      # 首次启动会自动创建管理员，随后请立刻在「账号安全」里改密
      ADMIN_USER: A
      ADMIN_PASS: Aa0123456789
      # 演示队伍 team01…team08 的初始密码（不需要演示队可设为空字符串）
      DEMO_PLAYER_PASS: desert888
      # 生产环境务必设置固定密钥；留空则自动生成并存入 /data/.jwt-secret
      JWT_SECRET: ""
      # 走 HTTPS 时设为 true，让 Cookie 带 Secure
      HTTPS: "false"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
